[project]
name = "groundwork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "dylangee3742@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
]

[project.scripts]
groundwork = "groundwork:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
